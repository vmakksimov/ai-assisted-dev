server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall back to index.html so React Router client routes work
    # (e.g. /history, /reviews/:id) on direct load / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built static assets aggressively (they are content-hashed by Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
