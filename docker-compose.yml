# DevGuard AI — full stack.
# Run everything with:  docker compose up -d
#   - db        PostgreSQL                       (localhost:5432)
#   - backend   FastAPI (migrates, then serves)  (http://localhost:8009)
#   - frontend  React SPA via nginx              (http://localhost:5173)
#
# Secrets (GEMINI_API_KEY, etc.) are read from the repo-root .env (see .env.example).

services:
  db:
    image: postgres:16-alpine
    container_name: devguard-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devguard}
      POSTGRES_DB: ${POSTGRES_DB:-devguard}
    ports:
      - "5432:5432"
    volumes:
      - devguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devguard} -d ${POSTGRES_DB:-devguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [devguard]

  backend:
    build:
      context: ./backend
    container_name: devguard-backend
    # Provides GEMINI_API_KEY and friends. Optional so the stack still builds if absent.
    env_file:
      - path: ./.env
        required: false
    environment:
      # Inside the compose network, reach Postgres by its service name (not localhost).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devguard}:${POSTGRES_PASSWORD:-devguard}@db:5432/${POSTGRES_DB:-devguard}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8009:8009"
    depends_on:
      db:
        condition: service_healthy
    networks: [devguard]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the SPA at build time; the browser calls the published backend port.
        VITE_API_BASE_URL: http://localhost:8009/api/v1
    container_name: devguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks: [devguard]

  # Optional DB admin UI. Start with: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: devguard-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@devguard.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks: [devguard]

volumes:
  devguard_pgdata:

networks:
  devguard:
